{% extends 'base.html' %}
{% block content %}
<div class="card top-50 right-50 align-center " style="align-self: center; width: 40%; height: 50%; left: 30%; top: 100px" >
  <div class="card-body align-center " style="align-self: auto; justify-content: center; text-align: center
">
    <form method="post" action="{{url_for('register')}}">
   <div class="mb-3 row">
  <label for="username" class="col-sm-2 col-form-label">User Name</label>
  <div class="col-sm-10">
    <input type="text" class="form-control" id="username" name="username" placeholder="username">
  </div>
</div>
<div class="mb-3 row">
  <label for="email" class="col-sm-2 col-form-label">Email</label>
  <div class="col-sm-10">
    <input type="email" class="form-control" id="email" name="email" placeholder="email@example.com">
  </div>
</div>
    <div class="mb-3 row">
  <label for="password" class="col-sm-2 col-form-label">Password</label>
  <div class="col-sm-10">
    <input type="password"  class="form-control" id="password" name="password" placeholder="******">
  </div>
</div>
    <div class="mb-3 row">
  <label for="confirm_password" class="col-sm-2 col-form-label">Confirm password</label>
  <div class="col-sm-10">
    <input type="text"  class="form-control" id="confirm_password" name="confirm_password">
  </div>
</div>
  <div class="mb-3 row" style="justify-content: center;">
  <div class="col-sm-10">
    <button type="submit"  class="form-control bg-primary justify-content-center " id="register" name="register">Register</button>
  </div>
</div>
      </form>
</div>
  </div>
{% endblock %}
